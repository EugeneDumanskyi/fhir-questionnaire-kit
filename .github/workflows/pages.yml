name: Pages

# The docs at the site's root and the playground under /playground/ on GitHub
# Pages (ADR-0019; M9 plan D2, M10 plan D2). Every push to main has passed CI
# as a pull request, so the deploy builds and publishes; it does not re-run
# the gates. M11 ties both sites to the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and none cut off halfway: a later push waits.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the docs and the playground
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the packages, then the playground from their dist
        run: pnpm build:playground

      # Links to the repository go to the commit being deployed.
      - name: Build the docs
        run: pnpm build:docs

      # Both builds use relative paths, so each is published as built: the
      # docs at the root, the playground one directory down. The deploy stops
      # if either is missing, rather than publish one over the other.
      - name: Lay out the site
        run: |
          mkdir -p site
          cp -R apps/docs/dist/. site/
          cp -R apps/playground/dist site/playground
          test -f site/index.html
          test -f site/conformance.html
          test -f site/playground/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
