name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run teaches nothing and costs a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The fast lane. NFR-M-07 gives it 3 minutes. Required, with the engine gates
  # and incremental mutation from M2. Dependency, licence, packed-contents,
  # accessibility and browser gates become blocking in the milestone that first
  # produces what they guard (06-roadmap.md §5). A gate that is red because its
  # subject does not exist teaches the team to ignore red.
  fast-lane:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Node 25 and later no longer bundle Corepack, so it is installed rather
      # than assumed. The pnpm version comes from package.json's packageManager,
      # which is the same pin a developer's machine reads.
      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  # The engine's gates, required: core coverage at 95 % line / 90 % branch
  # from its own Node suite (NFR-Q-01), the bundle budgets of @fhirq/core, and
  # from M3 @fhirq/core/resume with the resume bundle-inputs check (NFR-S-02,
  # ADR-0021), from M5 the view and from M6 @fhirq/react, and the API reports
  # (NFR-M-04): a public surface that differs from packages/*/etc/*.api.md
  # fails until the PR commits the new report. The other entry points are
  # measured and reported, and are gated from the milestone that builds each
  # (scripts/budgets.json `gated`).
  engine-gates:
    name: Engine gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Core coverage, 95 % line and 90 % branch
        run: pnpm test:coverage:core

      - name: Bundle budgets, @fhirq/core, @fhirq/core/view, @fhirq/core/resume and @fhirq/react, and resume inputs
        run: pnpm measure --check

      - name: API reports, @fhirq/core, @fhirq/core/view, @fhirq/core/resume, @fhirq/react and @fhirq/element
        run: pnpm api:check

      - name: Upload the coverage summary and the bundle report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-gates
          path: |
            coverage/coverage-summary.json
            reports/bundle-sizes.md
            reports/api/
          retention-days: 30

  # Mutation score ≥ 80 % on the engine and view modules (NFR-Q-03), required
  # from M2. Spike S2 measured it (docs/00-s2-mutation-cost.md): about 2 min
  # incrementally on this runner. From M5 the lane is a matrix of shards by
  # module, S2's relief for K1: every module is still mutated, and each shard
  # holds the 80 % on its own (scripts/mutation-shard.mjs). Each shard's
  # incremental file travels in the Actions cache, keyed per shard and branch
  # with main as the fallback, and the nightly full run refreshes main's
  # (ADR-0018, A6).
  mutation-shard:
    name: Mutation, incremental (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [enablement, session, rules, view-tree, view-parts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore the incremental result
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker/${{ matrix.shard }}/incremental.json
          key: stryker-${{ matrix.shard }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ matrix.shard }}-${{ github.head_ref || github.ref_name }}-
            stryker-${{ matrix.shard }}-main-

      - name: Mutation test
        run: |
          echo "cores: $(nproc)"
          start=$(date +%s)
          pnpm test:mutation:shard ${{ matrix.shard }}
          echo "mutation wall-clock: $(( $(date +%s) - start )) s"

      - name: Save the incremental result
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: reports/stryker/${{ matrix.shard }}/incremental.json
          key: stryker-${{ matrix.shard }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

      - name: Upload the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.shard }}
          path: reports/stryker/
          retention-days: 30

  # One check for the lane, whatever the shards: it passes only when every
  # shard did, so a required check names this and not a shard.
  mutation:
    name: Mutation, incremental
    needs: mutation-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutation-shard.result }}" = success

  # NFR-P-01, P-02 and P-08 (M2 plan D7, revised 2026-09-17). Hosted runners
  # differ by up to 2× between jobs and about 1 % within one, so timings are
  # compared with the merge base benchmarked in this same job, runs
  # alternating, and fail above 20 %. Retained heap is stable across runners
  # and fails above 20 % of benchmarks/baseline.json; the 25-item absolute
  # budgets always apply. One automatic re-run before failing.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # A pull request is compared with its merge base; a push to main with the
      # commit before it. A base without the benchmark suite has nothing to
      # compare, and only the budgets and heap are checked.
      - name: Check out and install the merge base
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then base=$(git merge-base "origin/$BASE_REF" HEAD); else base="$BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "no base commit"; exit 0; fi
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          if [ ! -f "$RUNNER_TEMP/base/packages/core/bench/session.bench.ts" ]; then echo "the base has no benchmarks"; exit 0; fi
          (cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile)
          echo "dir=$RUNNER_TEMP/base" >> "$GITHUB_OUTPUT"
          echo "base: $base"

      - name: Benchmarks, five runs against the merge base, re-running once before failing
        env:
          BASE_DIR: ${{ steps.base.outputs.dir }}
        run: |
          against=()
          if [ -n "$BASE_DIR" ]; then against=(--against "$BASE_DIR"); fi
          pnpm bench "${against[@]}"
          if ! pnpm bench:compare; then
            echo "Over the tolerance; re-running the benchmarks once."
            pnpm bench "${against[@]}"
            pnpm bench:compare
          fi

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            reports/bench/results.json
            reports/bench/reference.json
          retention-days: 30

  # The React adapter's gates, required from M6 (06-roadmap.md §5): its client
  # tests in Chromium on React 18 and 19 with coverage at 85 % line / 80 %
  # branch (NFR-Q-02), among them controlled mode and tier-3 controls; SSR
  # hydration with 0 warnings on both majors in Chromium and WebKit
  # (NFR-C-08); and the quickstart, hydrated, completed and 0 axe violations
  # with the demo (M6 AC-1, plan D11). Its bundle budget and API report are in
  # the engine's gates, its lint rules and Node render in the fast lane.
  react-gates:
    name: React gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Client tests in Chromium, React 18 and 19, coverage 85 % line and 80 % branch
        run: pnpm test:coverage:react

      - name: Hydration, the quickstart and axe, React 18 and 19, Chromium and WebKit
        run: pnpm test:browser:react

      - name: Upload the coverage summary and the browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: react-gates
          path: |
            coverage/react/coverage-summary.json
            playwright-report/
          retention-days: 30

  # M1's spike proofs (S1, decision D5): the DOM contract and axe on the
  # slice, and the bundle report. Deliberately not a required check:
  # accessibility blocks from M8 (06-roadmap.md §5); M6 moved hydration to the
  # React gates. The element's browser specs run here in Chromium,
  # Firefox and WebKit, with its client tests in Chromium, until M7's Element
  # gates job takes them and makes them blocking (M7 plan D8). Keystroke to
  # paint is read here too, report only, after the proofs so none runs beside
  # it (NFR-P-03).
  spike-proofs:
    name: Spike proofs (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Bundle report
        run: pnpm measure

      - name: Browser proofs
        run: pnpm test:browser:proofs

      - name: The element's browser specs, Chromium, Firefox and WebKit
        run: pnpm test:browser:element

      - name: The element's client tests in Chromium
        run: pnpm test:element

      - name: Keystroke to paint, report only, React 18 and 19 and the element in Chromium
        run: pnpm test:keystroke

      - name: Upload the bundle report and the browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: spike-proofs
          path: |
            reports/
            playwright-report/
          retention-days: 30
