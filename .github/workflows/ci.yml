name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run teaches nothing and costs a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The fast lane. NFR-M-07 gives it 3 minutes. Required, with the engine gates
  # and incremental mutation from M2. Dependency, licence, packed-contents,
  # accessibility and browser gates become blocking in the milestone that first
  # produces what they guard (06-roadmap.md §5). A gate that is red because its
  # subject does not exist teaches the team to ignore red.
  fast-lane:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Node 25 and later no longer bundle Corepack, so it is installed rather
      # than assumed. The pnpm version comes from package.json's packageManager,
      # which is the same pin a developer's machine reads.
      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  # The engine's M2 gates, required: core coverage at 95 % line / 90 % branch
  # from its own Node suite (NFR-Q-01), and the @fhirq/core bundle budget
  # (NFR-S-02). The other entry points are measured and reported, and are gated
  # from the milestone that builds each (scripts/budgets.json `gated`).
  engine-gates:
    name: Engine gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Core coverage, 95 % line and 90 % branch
        run: pnpm test:coverage:core

      - name: Bundle budget, @fhirq/core
        run: pnpm measure --check

      - name: Upload the coverage summary and the bundle report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-gates
          path: |
            coverage/coverage-summary.json
            reports/bundle-sizes.md
          retention-days: 30

  # Mutation score ≥ 80 % on the enablement modules (NFR-Q-03), required from
  # M2. Spike S2 measured it (docs/00-s2-mutation-cost.md): about 2 min
  # incrementally on this runner. The incremental file travels in the Actions
  # cache, keyed per branch with main as the fallback, and the nightly full run
  # refreshes main's (ADR-0018, A6).
  mutation:
    name: Mutation, incremental
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore the incremental result
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker/incremental.json
          key: stryker-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.head_ref || github.ref_name }}-
            stryker-main-

      - name: Mutation test
        run: |
          echo "cores: $(nproc)"
          start=$(date +%s)
          pnpm test:mutation
          echo "mutation wall-clock: $(( $(date +%s) - start )) s"

      - name: Save the incremental result
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: reports/stryker/incremental.json
          key: stryker-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

      - name: Upload the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation
          path: reports/stryker/
          retention-days: 30

  # NFR-P-01, P-02 and P-08 against the committed baseline (M2 plan D7): the
  # median of five runs, failing above 20 % after one automatic re-run. The
  # baseline is measured here, on this runner class, and changes only through
  # an explicit PR. Not required: unchanged code measured 2× apart across
  # hosted runners, so the gate's form is back with the maintainer (M2 step 12).
  bench:
    name: Benchmarks (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Benchmarks, five runs
        run: pnpm bench

      - name: Compare with the baseline, re-running once before failing
        if: ${{ hashFiles('benchmarks/baseline.json') != '' }}
        run: |
          if ! pnpm bench:compare; then
            echo "Over the tolerance; re-running the benchmarks once."
            pnpm bench
            pnpm bench:compare
          fi

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: reports/bench/results.json
          retention-days: 30

  # M1's spike proofs (S1, decision D5): the DOM contract, axe, hydration on
  # React 18 and 19, caret and CSP in Chromium and WebKit, and the bundle
  # report. Deliberately not a required check: SSR blocks from M6, CSP from M7,
  # accessibility from M8 and budgets from M2 (06-roadmap.md §5).
  spike-proofs:
    name: Spike proofs (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Bundle report
        run: pnpm measure

      - name: Browser proofs
        run: pnpm test:browser

      - name: Upload the bundle report and the browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: spike-proofs
          path: |
            reports/
            playwright-report/
          retention-days: 30
