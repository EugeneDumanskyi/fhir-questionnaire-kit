name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run teaches nothing and costs a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The fast lane. NFR-M-07 gives it 3 minutes. Required, with the engine gates
  # and incremental mutation from M2. Dependency, licence, packed-contents,
  # accessibility and browser gates become blocking in the milestone that first
  # produces what they guard (06-roadmap.md §5). A gate that is red because its
  # subject does not exist teaches the team to ignore red.
  fast-lane:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Node 25 and later no longer bundle Corepack, so it is installed rather
      # than assumed. The pnpm version comes from package.json's packageManager,
      # which is the same pin a developer's machine reads.
      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  # The engine's gates, required: core coverage at 95 % line / 90 % branch
  # from its own Node suite (NFR-Q-01), the bundle budgets of @fhirq/core, and
  # from M3 @fhirq/core/resume with the resume bundle-inputs check (NFR-S-02,
  # ADR-0021), from M5 the view, from M6 @fhirq/react and from M7 the element
  # and its IIFE (ADR-0024), from M8 the theme's stylesheets, and the API
  # reports (NFR-M-04): a public surface that differs from
  # packages/*/etc/*.api.md fails until the PR commits the new report. From
  # M10 the coverage run's test report also holds every conformance row's
  # links to passing tests (NFR-Q-04, scripts/check-conformance.mjs). From M11
  # each package is packed once, and the tarballs hold package.json, README,
  # LICENSE, NOTICE and dist only (NFR-S-08, scripts/check-packed.mjs), and
  # their manifests name no runtime dependency outside the kit, directly or
  # transitively (NFR-S-01, scripts/check-dependencies.mjs).
  engine-gates:
    name: Engine gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Core coverage, 95 % line and 90 % branch
        run: pnpm test:coverage:core

      - name: Conformance links, every supported or partial row links a passing test
        run: node scripts/check-conformance.mjs

      - name: Bundle budgets, @fhirq/core, @fhirq/core/view, @fhirq/core/resume, @fhirq/react, the element and its IIFE, and resume inputs
        run: pnpm measure --check

      - name: API reports, @fhirq/core, @fhirq/core/view, @fhirq/core/resume, @fhirq/react and @fhirq/element
        run: pnpm api:check

      - name: Package build, ESM and CJS, and every exports target exists
        run: pnpm build

      - name: Packed contents, package.json, README, LICENSE, NOTICE and dist only
        run: pnpm packed:check

      - name: Dependencies, 0 direct and 0 transitive outside the kit, @fhirq pinned exactly
        run: node scripts/check-dependencies.mjs

      - name: SBOMs, one per published package, naming nothing outside the kit
        run: pnpm build:sbom

      - name: Upload the SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: reports/sbom/
          retention-days: 90

      - name: Upload the coverage summary and the bundle report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-gates
          path: |
            coverage/coverage-summary.json
            reports/core-tests.json
            reports/bundle-sizes.md
            reports/api/
          retention-days: 30

  # Mutation score ≥ 80 % on the engine and view modules (NFR-Q-03), required
  # from M2. Spike S2 measured it (docs/00-s2-mutation-cost.md): about 2 min
  # incrementally on this runner. From M5 the lane is a matrix of shards by
  # module, S2's relief for K1: every module is still mutated, and each shard
  # holds the 80 % on its own (scripts/mutation-shard.mjs). Each shard's
  # incremental file travels in the Actions cache, keyed per shard and branch
  # with main as the fallback, and the nightly full run refreshes main's
  # (ADR-0018, A6).
  mutation-shard:
    name: Mutation, incremental (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [enablement, session, rules, view-tree, view-parts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore the incremental result
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker/${{ matrix.shard }}/incremental.json
          key: stryker-${{ matrix.shard }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ matrix.shard }}-${{ github.head_ref || github.ref_name }}-
            stryker-${{ matrix.shard }}-main-

      - name: Mutation test
        run: |
          echo "cores: $(nproc)"
          start=$(date +%s)
          pnpm test:mutation:shard ${{ matrix.shard }}
          echo "mutation wall-clock: $(( $(date +%s) - start )) s"

      - name: Save the incremental result
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: reports/stryker/${{ matrix.shard }}/incremental.json
          key: stryker-${{ matrix.shard }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

      - name: Upload the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.shard }}
          path: reports/stryker/
          retention-days: 30

  # One check for the lane, whatever the shards: it passes only when every
  # shard did, so a required check names this and not a shard.
  mutation:
    name: Mutation, incremental
    needs: mutation-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutation-shard.result }}" = success

  # NFR-P-01, P-02 and P-08 (M2 plan D7, revised 2026-09-17). Hosted runners
  # differ by up to 2× between jobs and about 1 % within one, so timings are
  # compared with the merge base benchmarked in this same job, runs
  # alternating, and fail above 20 %. Retained heap is stable across runners
  # and fails above 20 % of benchmarks/baseline.json; the 25-item absolute
  # budgets always apply. One automatic re-run before failing.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # A pull request is compared with its merge base; a push to main with the
      # commit before it. A base without the benchmark suite has nothing to
      # compare, and only the budgets and heap are checked.
      - name: Check out and install the merge base
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then base=$(git merge-base "origin/$BASE_REF" HEAD); else base="$BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "no base commit"; exit 0; fi
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          if [ ! -f "$RUNNER_TEMP/base/packages/core/bench/session.bench.ts" ]; then echo "the base has no benchmarks"; exit 0; fi
          (cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile)
          echo "dir=$RUNNER_TEMP/base" >> "$GITHUB_OUTPUT"
          echo "base: $base"

      - name: Benchmarks, five runs against the merge base, re-running once before failing
        env:
          BASE_DIR: ${{ steps.base.outputs.dir }}
        run: |
          against=()
          if [ -n "$BASE_DIR" ]; then against=(--against "$BASE_DIR"); fi
          pnpm bench "${against[@]}"
          if ! pnpm bench:compare; then
            echo "Over the tolerance; re-running the benchmarks once."
            pnpm bench "${against[@]}"
            pnpm bench:compare
          fi

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            reports/bench/results.json
            reports/bench/reference.json
          retention-days: 30

  # The React adapter's gates, required from M6 (06-roadmap.md §5): its client
  # tests in Chromium on React 18 and 19 with coverage at 85 % line / 80 %
  # branch (NFR-Q-02), among them controlled mode and tier-3 controls; SSR
  # hydration with 0 warnings on both majors in Chromium and WebKit
  # (NFR-C-08); and the quickstart, hydrated, completed and 0 axe violations
  # with the demo (M6 AC-1, plan D11). Its bundle budget and API report are in
  # the engine's gates, its lint rules and Node render in the fast lane.
  react-gates:
    name: React gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Client tests in Chromium, React 18 and 19, coverage 85 % line and 80 % branch
        run: pnpm test:coverage:react

      - name: Hydration, the quickstart and axe, React 18 and 19, Chromium and WebKit
        run: pnpm test:browser:react

      - name: Upload the coverage summary and the browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: react-gates
          path: |
            coverage/react/coverage-summary.json
            playwright-report/
          retention-days: 30

  # The element's gates, required from M7 (06-roadmap.md §5, M7 plan D8): its
  # client tests in Chromium with coverage at 85 % line / 80 % branch
  # (NFR-Q-02), among them the throwing-stub test that holds the network to
  # the default resolver (AC-14.6.1); then its browser specs in Chromium,
  # Firefox and WebKit: caret and focus, CSP with 0 style routes (NFR-C-07),
  # the default resolver, the script-tag embed, hostile-CSS isolation, tokens
  # and parts, reconnection, two elements, and axe at 0 on the demo and the
  # embed; and the DOM contract on the demo across both renderers (ADR-0007).
  # Its bundle budgets and API report are in the engine's gates, its lint
  # rules in the fast lane.
  element-gates:
    name: Element gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Client tests in Chromium, coverage 85 % line and 80 % branch
        run: pnpm test:coverage:element

      - name: Browser specs, Chromium, Firefox and WebKit, and the DOM contract on the demo
        run: pnpm test:browser:element

      - name: Upload the coverage summary and the browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: element-gates
          path: |
            coverage/element/coverage-summary.json
            playwright-report/
          retention-days: 30

  # Accessibility and the theme, required from M8 (06-roadmap.md §5, M8 plan
  # D4): axe at 0 violations, WCAG 2.2 A and AA, across the demo and the form
  # of every kind, tiers 1-3 in both renderers and 4 in React, loaded,
  # answered and refused, light and dark, 375 and 1280 px, in Chromium
  # (NFR-A-01); then print, the tier-2 worked example, the token sentinel,
  # the visual gates (contrast, focus, targets, reflow, motion), RTL and the
  # screen-reader pass pages in Chromium, Firefox and WebKit. The report and
  # the pass pages (docs/accessibility.md) are published as an artifact
  # whether or not the matrix passed. It replaced M1's axe proof on the slice.
  a11y-gates:
    name: Accessibility gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Axe matrix in Chromium; the theme's, visual, RTL and pass-page gates in Chromium, Firefox and WebKit
        run: pnpm test:browser:a11y

      - name: Build the accessibility report
        if: ${{ !cancelled() }}
        run: pnpm a11y:report

      - name: Build the screen-reader pass pages
        if: ${{ !cancelled() }}
        run: pnpm a11y:pages

      - name: Upload the accessibility report, the pass pages and the browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility
          path: |
            reports/a11y/
            playwright-report/
          retention-days: 30

  # The playground's gates, required from M9 (06-roadmap.md §5, M9 plan D10):
  # the packages and then the playground built from their dist (ADR-0019,
  # AC-8); its specs on that build in Chromium, the fold, the cascade, the
  # panes, the paste editor, the samples and the tiers, and its privacy claim
  # in Chromium, Firefox and WebKit, the policy first in <head>, every
  # connection refused, and only D4's requests across load, paste, answers and
  # every tier (AC-5); then Lighthouse on the same build, three runs on the
  # default mobile preset, with NFR-P-06 asserted on the median run (AC-7).
  # Every run's numbers go to the job summary and the reports to an artifact,
  # whether or not the thresholds held. Its lint rules are in the fast lane.
  # From M10 the docs site's gates run here too (M10 plan D10): the build, the
  # link checker over it, and its policy spec in all three engines. The name
  # stays, so branch protection is unaffected.
  playground-gates:
    name: Playground gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build the packages, then the playground from their dist
        run: pnpm build:playground

      # ADR-0019's link checker, over the docs as pages.yml lays them out,
      # the playground under playground/ (M10 plan D10).
      - name: Build the docs, then check every link in them
        run: |
          pnpm build:docs
          pnpm docs:links

      - name: Playground specs in Chromium, the privacy claim and the docs' policy in Chromium, Firefox and WebKit
        run: pnpm test:playground

      # The runner's Google Chrome, not Playwright's: Lighthouse's own launcher
      # finds it, as it would on a developer's machine.
      - name: Lighthouse, three runs on the mobile preset, NFR-P-06 on the median
        run: pnpm lighthouse

      - name: Upload the Lighthouse reports and the browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playground-gates
          path: |
            reports/lighthouse/
            playwright-report/
          retention-days: 30

  # The consumer smoke tests, from M11 (NFR-C-02, NFR-C-03, plan step 5). The
  # packages are built and packed once; each project in tests/consumers then
  # installs the tarballs as an adopter's would, outside the workspace, with
  # `npm ci` against its own lockfile, and typechecks, builds or runs: Node ESM
  # and CommonJS, TypeScript under node16 and bundler resolution, Vite and
  # webpack 5 on React 18 and 19, the Next.js App Router, and a plain page with
  # the script tag. Each page renders the demonstration form in Chromium and
  # answers its conditional question (scripts/consumers.mjs). Every project
  # runs on Node 22, the floor `engines` names, and the Node project again on
  # 24. The full matrix on both runs nightly.
  consumer-smoke:
    name: Consumer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and pack the packages
        run: |
          pnpm build
          node scripts/pack.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/consumers/*/package-lock.json

      - name: Consumers on Node 22, every environment
        run: node scripts/consumers.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Consumers on Node 24, ESM and CommonJS
        run: node scripts/consumers.mjs node

  # Keystroke to paint (NFR-P-03), report only: React 18 and 19 and the
  # element in Chromium, on one worker in a job of its own, so no other spec
  # runs beside the reading. Every other spec of the retired spike-proofs job
  # now runs in a required job, and M1's axe proof on the slice was replaced
  # by the matrix in Accessibility gates (M8).
  keystroke:
    name: Keystroke to paint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Keystroke to paint, report only, React 18 and 19 and the element in Chromium
        run: pnpm test:keystroke

      - name: Upload the browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: keystroke
          path: playwright-report/
          retention-days: 30
